name: Build iOS 6 .deb Package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build TgVoipWebrtcIOS6Core
        run: |
          mkdir -p thirdparty/TgVoipWebrtcIOS6/lib
          ./thirdparty/TgVoipWebrtcIOS6/build_core_ios6_universal.sh > build_log.txt 2>&1 || (cat build_log.txt && exit 1)

      - name: Build UofsTg Package
        run: |
          cp config.h.example config.h
          cd theos/Twelvium
          make package
          mkdir -p Payload
          cp -r .theos/obj/debug/UofsTg.app Payload/ || cp -r .theos/obj/UofsTg.app Payload/
          zip -r UofsTg.ipa Payload

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UofsTg-packages
          path: |
            theos/Twelvium/packages/*.deb
            theos/Twelvium/UofsTg.ipa
