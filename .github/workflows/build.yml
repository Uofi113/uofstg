name: Build UofsTg IPA + DEB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Ruby gems (xcpretty only via gem, NOT brew) ──────────────────────
      - name: Install Ruby gems
        run: gem install xcodeproj xcpretty --no-document

      # ── Homebrew tools ────────────────────────────────────────────────────
      - name: Install ldid + dpkg
        run: brew install ldid dpkg

      # ── Pick exact Xcode version ──────────────────────────────────────────
      - name: Select Xcode 14.3.1
        run: |
          sudo xcode-select -s /Applications/Xcode_14.3.1.app/Contents/Developer
          xcodebuild -version

      # ── config.h (API credentials placeholder) ────────────────────────────
      - name: Setup config.h
        run: cp config.h.example config.h

      # ── Build TgVoip static lib (required before main build) ──────────────
      - name: Build TgVoipWebrtcIOS6Core
        run: |
          mkdir -p thirdparty/TgVoipWebrtcIOS6/lib
          bash thirdparty/TgVoipWebrtcIOS6/build_core_ios6_universal.sh \
            2>&1 | tee /tmp/tgvoip_build.log | tail -20 || {
            echo "=== TgVoip build failed ==="
            cat /tmp/tgvoip_build.log
            exit 1
          }

      # ── Create SHARED Xcode scheme (CI only sees shared schemes) ──────────
      - name: Create shared Xcode scheme
        run: |
          mkdir -p Telegraph.xcodeproj/xcshareddata/xcschemes
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Telegraph.xcodeproj')
          main_target = project.targets.find { |t| t.product_type == 'com.apple.product-type.application' && t.name == 'Telegraph' }
          main_target ||= project.targets.find { |t| t.product_type == 'com.apple.product-type.application' }
          raise "No app target found! Available: #{project.targets.map(&:name).join(', ')}" unless main_target
          puts "Using target: #{main_target.name}"
          scheme = Xcodeproj::XCScheme.new
          scheme.add_build_target(main_target)
          scheme.set_launch_target(main_target)
          scheme.save_as('Telegraph.xcodeproj', 'Telegraph', true)  # true = shared
          puts "Shared scheme created"
          RUBY

      - name: List available schemes
        run: xcodebuild -project Telegraph.xcodeproj -list

      # ── Archive ───────────────────────────────────────────────────────────
      - name: Build archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Telegraph.xcodeproj \
            -scheme "Telegraph" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/UofsTg.xcarchive" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | xcpretty --color

      # ── ldid fake-sign + package IPA ──────────────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/UofsTg.xcarchive" \
            -name "*.app" ! -path "*/Watch/*" ! -path "*/WatchKit*" | head -1)
          echo "App bundle: $APP_PATH"

          # Fake-sign all executables (binary + frameworks)
          find "$APP_PATH" -type f -perm +111 | while read bin; do
            ldid -S "$bin" 2>/dev/null && echo "  signed: $(basename $bin)" || true
          done

          # Pack IPA
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr UofsTg.ipa Payload
          echo "IPA size: $(du -sh UofsTg.ipa | cut -f1)"

      # ── Build .deb ────────────────────────────────────────────────────────
      - name: Package DEB
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/UofsTg.xcarchive" \
            -name "*.app" ! -path "*/Watch/*" ! -path "*/WatchKit*" | head -1)
          APP_NAME=$(basename "$APP_PATH")
          DEB="$RUNNER_TEMP/deb_root"

          mkdir -p "$DEB/Applications/$APP_NAME"
          cp -r "$APP_PATH/." "$DEB/Applications/$APP_NAME/"
          mkdir -p "$DEB/DEBIAN"

          # control
          printf 'Package: com.example.uofstg\nName: UofsTg\nVersion: 0.91\nArchitecture: iphoneos-arm\nDescription: UofsTg - iOS 6 Telegram client\nMaintainer: UofsTg\nSection: Applications\nDepends: firmware (>= 6.0)\n' > "$DEB/DEBIAN/control"

          # postinst
          printf '#!/bin/sh\n[ -x /usr/bin/uicache ] && uicache\n' > "$DEB/DEBIAN/postinst"
          chmod 0755 "$DEB/DEBIAN/postinst"

          dpkg-deb --root-owner-group -b "$DEB" "$RUNNER_TEMP/UofsTg.deb"
          echo "DEB size: $(du -sh "$RUNNER_TEMP/UofsTg.deb" | cut -f1)"

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload IPA + DEB
        uses: actions/upload-artifact@v4
        with:
          name: UofsTg-release
          path: |
            ${{ runner.temp }}/UofsTg.ipa
            ${{ runner.temp }}/UofsTg.deb

      # ── Always upload build log (for debugging) ───────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
