name: Build UofsTg IPA + DEB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          brew install ldid dpkg xcpretty || true
          gem install xcodeproj || true

      - name: Setup config.h
        run: cp config.h.example config.h

      - name: Recreate Xcode schemes
        run: ruby recreate_schemes.rb

      - name: Show available schemes
        run: |
          xcodebuild -project Telegraph.xcodeproj -list 2>/dev/null || true
          xcodebuild -workspace Telegram.xcworkspace -list 2>/dev/null || true

      - name: Build archive
        run: |
          xcodebuild archive \
            -project Telegraph.xcodeproj \
            -target Telegraph \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/UofsTg.xcarchive" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=6.0 \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -50

      - name: Check archive
        run: |
          if [ ! -d "$RUNNER_TEMP/UofsTg.xcarchive" ]; then
            echo "=== BUILD FAILED - last 100 lines ==="
            tail -100 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          echo "Archive contents:"
          find "$RUNNER_TEMP/UofsTg.xcarchive" -name "*.app" | head -5

      - name: Sign with ldid and package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/UofsTg.xcarchive" \
            -name "*.app" -not -path "*/Watch/*" | head -1)
          echo "App: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH" .app)

          # Fake-sign binary for jailbroken iOS 6
          BIN="$APP_PATH/$APP_NAME"
          [ -f "$BIN" ] && ldid -S "$BIN" && echo "ldid signed: $BIN"

          # Build IPA
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr UofsTg.ipa Payload
          echo "IPA: $(du -sh UofsTg.ipa)"

      - name: Package .deb
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/UofsTg.xcarchive" \
            -name "*.app" -not -path "*/Watch/*" | head -1)
          APP_NAME=$(basename "$APP_PATH")
          DEB_DIR="$RUNNER_TEMP/deb_root"

          mkdir -p "$DEB_DIR/Applications/$APP_NAME"
          cp -r "$APP_PATH/." "$DEB_DIR/Applications/$APP_NAME/"
          mkdir -p "$DEB_DIR/DEBIAN"

          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: com.example.uofstg
          Name: UofsTg
          Version: 0.91
          Architecture: iphoneos-arm
          Description: UofsTg - iOS 6 Telegram client
          Maintainer: UofsTg
          Section: Applications
          Depends: firmware (>= 6.0)
          EOF

          cat > "$DEB_DIR/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          [ -x /usr/bin/uicache ] && uicache
          EOF
          chmod 0755 "$DEB_DIR/DEBIAN/postinst"

          dpkg-deb --root-owner-group -b "$DEB_DIR" "$RUNNER_TEMP/UofsTg.deb"
          echo "DEB: $(du -sh "$RUNNER_TEMP/UofsTg.deb")"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UofsTg-release
          path: |
            ${{ runner.temp }}/UofsTg.ipa
            ${{ runner.temp }}/UofsTg.deb

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
